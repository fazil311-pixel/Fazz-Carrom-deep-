<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Fazil Carom — Local 2P</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; touch-action:none; }
  html, body { width:100%; height:100%; overflow:hidden; background:#1a1a1a; font-family:system-ui,sans-serif; }
  #game { position:fixed; inset:0; }
  #hud {
    position:fixed; top:0; left:0; right:0; padding:10px 16px;
    display:flex; justify-content:space-between; align-items:center;
    color:#fff; font-size:14px; pointer-events:none; z-index:10;
    background:linear-gradient(to bottom, rgba(0,0,0,.6), transparent);
  }
  #turn { font-weight:700; font-size:16px; }
  #turn.p1 { color:#ff5c5c; }
  #turn.p2 { color:#5c9cff; }
  #scores { font-size:13px; opacity:.9; }
  #power {
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    width:60%; max-width:300px; height:12px; background:rgba(255,255,255,.15);
    border-radius:6px; overflow:hidden; z-index:10; pointer-events:none;
    opacity:0; transition:opacity .15s;
  }
  #power.on { opacity:1; }
  #powerFill { height:100%; width:0%; background:linear-gradient(90deg,#4caf50,#ffeb3b,#f44336); }
  #pass {
    position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:100;
    display:none; flex-direction:column; align-items:center; justify-content:center;
    color:#fff; text-align:center; padding:20px;
  }
  #pass.show { display:flex; }
  #pass h1 { font-size:24px; margin-bottom:12px; }
  #pass p { opacity:.8; margin-bottom:24px; font-size:14px; }
  #pass button {
    padding:14px 40px; font-size:18px; font-weight:700; border:none;
    border-radius:10px; background:#4caf50; color:#fff; cursor:pointer;
  }
  #pass button:active { transform:scale(.97); }
  #msg {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    color:#fff; font-size:28px; font-weight:900; text-align:center;
    pointer-events:none; opacity:0; transition:opacity .3s; z-index:50;
    text-shadow:0 2px 12px rgba(0,0,0,.9); padding:20px;
  }
  #msg.on { opacity:1; }
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
  <div id="turn" class="p1">Player 1's turn</div>
  <div id="scores">P1: 0 &nbsp;|&nbsp; P2: 0</div>
</div>
<div id="power"><div id="powerFill"></div></div>
<div id="pass">
  <h1 id="passTitle">Player 2's turn</h1>
  <p>Pass the device to the other player.</p>
  <button id="passBtn">I'm Ready</button>
</div>
<div id="msg"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';

/* ============================================================
   FAZIL CAROM — Local 2-Player 3D Carrom
   Rules: pocket all your color, cover Queen, striker fouls
   ============================================================ */

// ---- Constants (standard carrom, scaled) ----
const BOARD = 0.74;          // board half-size (m) — 29" board ~ 0.7366m
const POCKET_R = 0.028;      // pocket radius
const PUCK_R = 0.0159;       // 3.18cm diameter puck
const STRIKER_R = 0.02;      // 4.13cm diameter striker
const PUCK_H = 0.008;
const STRIKER_H = 0.012;
const FRICTION = 0.965;      // per-second velocity damping factor
const SUBSTEPS = 6;

// ---- Scene ----
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a1a);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('game').appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.01, 100);
camera.position.set(0, 1.15, 0.95);
camera.lookAt(0, 0, 0);

// ---- Lights ----
const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(0.5, 2, 0.8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -1;
sun.shadow.camera.right = 1;
sun.shadow.camera.top = 1;
sun.shadow.camera.bottom = -1;
sun.shadow.camera.near = 0.1;
sun.shadow.camera.far = 5;
sun.shadow.bias = -0.0001;
scene.add(sun);

const fill = new THREE.DirectionalLight(0xffeedd, 0.35);
fill.position.set(-0.5, 1, -0.5);
scene.add(fill);

// ---- Physics world ----
const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.82, 0) });
world.broadphase = new CANNON.NaiveBroadphase();
world.solver.iterations = 10;

// Ground plane (board surface)
const groundBody = new CANNON.Body({ mass:0, shape: new CANNON.Plane() });
groundBody.quaternion.setFromEuler(-Math.PI/2, 0, 0);
groundBody.position.set(0, 0, 0);
world.addBody(groundBody);

// Walls (carrom board frame) — thick boxes around the play area
const WALL_H = 0.04;
const WALL_T = 0.03;
function addWall(x, z, w, d) {
  const body = new CANNON.Body({ mass:0, shape: new CANNON.Box(new CANNON.Vec3(w/2, WALL_H/2, d/2)) });
  body.position.set(x, WALL_H/2, z);
  world.addBody(body);
}
addWall(0,  BOARD + WALL_T/2, BOARD*2 + WALL_T*2, WALL_T); // top
addWall(0, -BOARD - WALL_T/2, BOARD*2 + WALL_T*2, WALL_T); // bottom
addWall( BOARD + WALL_T/2, 0, WALL_T, BOARD*2);           // right
addWall(-BOARD - WALL_T/2, 0, WALL_T, BOARD*2);           // left

// ---- Visual board ----
const boardMat = new THREE.MeshStandardMaterial({ color:0xd4a574, roughness:0.7, metalness:0.05 });
const boardMesh = new THREE.Mesh(new THREE.BoxGeometry(BOARD*2, 0.02, BOARD*2), boardMat);
boardMesh.position.y = -0.01;
boardMesh.receiveShadow = true;
scene.add(boardMesh);

// Frame
const frameMat = new THREE.MeshStandardMaterial({ color:0x5c3a21, roughness:0.6 });
function addFrame(x, z, w, d) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, WALL_H, d), frameMat);
  m.position.set(x, WALL_H/2, z);
  m.castShadow = true;
  m.receiveShadow = true;
  scene.add(m);
}
addFrame(0,  BOARD + WALL_T/2, BOARD*2 + WALL_T*2, WALL_T);
addFrame(0, -BOARD - WALL_T/2, BOARD*2 + WALL_T*2, WALL_T);
addFrame( BOARD + WALL_T/2, 0, WALL_T, BOARD*2);
addFrame(-BOARD - WALL_T/2, 0, WALL_T, BOARD*2);

// Pockets (visual)
const pocketGeo = new THREE.CylinderGeometry(POCKET_R, POCKET_R, 0.025, 24);
const pocketMat = new THREE.MeshStandardMaterial({ color:0x111111, roughness:0.9 });
const pocketPositions = [
  [-BOARD+POCKET_R*1.6, -BOARD+POCKET_R*1.6],
  [ BOARD-POCKET_R*1.6, -BOARD+POCKET_R*1.6],
  [-BOARD+POCKET_R*1.6,  BOARD-POCKET_R*1.6],
  [ BOARD-POCKET_R*1.6,  BOARD-POCKET_R*1.6],
];
for (const [x,z] of pocketPositions) {
  const p = new THREE.Mesh(pocketGeo, pocketMat);
  p.position.set(x, 0.001, z);
  scene.add(p);
}

// Center circle decoration
const circleGeo = new THREE.RingGeometry(0.06, 0.065, 64);
const circleMat = new THREE.MeshBasicMaterial({ color:0x8a5a2b, side:THREE.DoubleSide });
const circle = new THREE.Mesh(circleGeo, circleMat);
circle.rotation.x = -Math.PI/2;
circle.position.y = 0.001;
scene.add(circle);

// ---- Pieces ----
const puckGeo = new THREE.CylinderGeometry(PUCK_R, PUCK_R, PUCK_H, 24);
const strikerGeo = new THREE.CylinderGeometry(STRIKER_R, STRIKER_R, STRIKER_H, 24);

const puckMats = {
  white: new THREE.MeshStandardMaterial({ color:0xf5f0e6, roughness:0.4 }),
  black: new THREE.MeshStandardMaterial({ color:0x2a2a2a, roughness:0.4 }),
  queen: new THREE.MeshStandardMaterial({ color:0xc0392b, roughness:0.4, emissive:0x330000 }),
};
const strikerMat = new THREE.MeshStandardMaterial({ color:0x3d7cf5, roughness:0.3, metalness:0.2 });

// Physics material for pucks/striker (low restitution, some friction)
const piecePhysicsMat = new CANNON.Material('piece');
const boardPhysicsMat  = new CANNON.Material('board');
world.addContactMaterial(new CANNON.ContactMaterial(piecePhysicsMat, boardPhysicsMat, {
  friction: 0.2, restitution: 0.35
}));
world.addContactMaterial(new CANNON.ContactMaterial(piecePhysicsMat, piecePhysicsMat, {
  friction: 0.1, restitution: 0.7
}));

const pieces = []; // {mesh, body, type, color, alive}

function addPiece(x, z, type, color) {
  const isStriker = type === 'striker';
  const radius = isStriker ? STRIKER_R : PUCK_R;
  const height = isStriker ? STRIKER_H : PUCK_H;
  const mat = isStriker ? strikerMat : puckMats[color];
  const geo = isStriker ? strikerGeo : puckGeo;

  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, height/2, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);

  const body = new CANNON.Body({
    mass: isStriker ? 1.5 : 1,
    shape: new CANNON.Cylinder(radius, radius, height, 24),
    material: piecePhysicsMat,
    linearDamping: 0.05,
    angularDamping: 0.9,
  });
  body.position.set(x, height/2, z);
  world.addBody(body);

  const piece = { mesh, body, type, color, alive:true, radius };
  pieces.push(piece);
  return piece;
}

// ---- Standard carrom arrangement ----
// Queen in center, 6 white + 6 black alternating around it
// Simplified: queen center, inner ring alternating, outer ring alternating
function setupPieces() {
  // Queen
  addPiece(0, 0, 'puck', 'queen');

  // Inner ring: 6 pucks alternating (white first)
  const innerR = PUCK_R * 2.15;
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2 + Math.PI / 6;
    const color = i % 2 === 0 ? 'white' : 'black';
    addPiece(Math.cos(a)*innerR, Math.sin(a)*innerR, 'puck', color);
  }

  // Outer ring: 12 pucks, but standard carrom has 6+6 = 12 total colored.
  // Inner has 3 white 3 black. Outer needs 3 white 3 black to complete 6+6.
  // (Real carrom: 9 white, 9 black, 1 queen — but for 2P simplified we use 6+6.)
  const outerR = PUCK_R * 3.6;
  const outerCount = 12;
  for (let i = 0; i < outerCount; i++) {
    const a = (i / outerCount) * Math.PI * 2;
    const color = i % 2 === 0 ? 'white' : 'black';
    addPiece(Math.cos(a)*outerR, Math.sin(a)*outerR, 'puck', color);
  }
}

setupPieces();

// Striker — placed on baseline, will be positioned per player
let striker = addPiece(0, -BOARD + 0.12, 'striker', null);

// ---- Game state ----
const state = {
  turn: 0,              // 0 = player1 (white), 1 = player2 (black)
  phase: 'aim',         // 'aim' | 'shooting' | 'wait' | 'pass' | 'over'
  scores: [0, 0],
  pocketed: [],         // pieces pocketed this shot
  queenPocketed: false,
  queenCovered: false,
  queenPocketedBy: null,
  shotInProgress: false,
  aiming: false,
  aimStart: new THREE.Vector2(),
  aimEnd: new THREE.Vector2(),
  power: 0,
};

const PLAYER_COLORS = ['white', 'black'];
const PLAYER_NAMES = ['Player 1 (White)', 'Player 2 (Black)'];

// ---- UI helpers ----
const turnEl = document.getElementById('turn');
const scoresEl = document.getElementById('scores');
const powerEl = document.getElementById('power');
const powerFill = document.getElementById('powerFill');
const passEl = document.getElementById('pass');
const passTitle = document.getElementById('passTitle');
const passBtn = document.getElementById('passBtn');
const msgEl = document.getElementById('msg');

function updateHUD() {
  turnEl.textContent = PLAYER_NAMES[state.turn] + "'s turn";
  turnEl.className = state.turn === 0 ? 'p1' : 'p2';
  scoresEl.textContent = `P1: ${state.scores[0]}  |  P2: ${state.scores[1]}`;
}

function showMsg(text, duration = 1500) {
  msgEl.textContent = text;
  msgEl.classList.add('on');
  clearTimeout(showMsg._t);
  showMsg._t = setTimeout(() => msgEl.classList.remove('on'), duration);
}

function showPass() {
  passTitle.textContent = PLAYER_NAMES[state.turn] + "'s turn";
  passEl.classList.add('show');
  state.phase = 'pass';
}

passBtn.addEventListener('click', () => {
  passEl.classList.remove('show');
  state.phase = 'aim';
  positionStriker();
});

// ---- Striker positioning ----
function positionStriker() {
  // Player 0 shoots from bottom baseline, player 1 from top
  const isBottom = state.turn === 0;
  const z = isBottom ? -BOARD + 0.12 : BOARD - 0.12;
  striker.body.position.set(0, STRIKER_H/2, z);
  striker.body.velocity.set(0, 0, 0);
  striker.body.angularVelocity.set(0, 0, 0);
  striker.body.quaternion.set(0, 0, 0, 1);
  striker.mesh.position.copy(striker.body.position);
  striker.mesh.quaternion.copy(striker.body.quaternion);
  striker.alive = true;
  striker.mesh.visible = true;
  striker.body.wakeUp();
}

// ---- Input handling ----
const canvas = renderer.domElement;
let pointerDown = false;
let dragStart = null;

function getNDC(e) {
  const r = canvas.getBoundingClientRect();
  return new THREE.Vector2(
    ((e.clientX - r.left) / r.width) * 2 - 1,
    -((e.clientY - r.top) / r.height) * 2 + 1
  );
}

function screenToBoard(ndc) {
  // Raycast onto y=0 plane to find board position
  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(ndc, camera);
  const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  const point = new THREE.Vector3();
  raycaster.ray.intersectPlane(plane, point);
  return point;
}

function onPointerDown(e) {
  if (state.phase !== 'aim') return;
  e.preventDefault();
  pointerDown = true;
  const ndc = getNDC(e);
  const boardPos = screenToBoard(ndc);
  if (!boardPos) return;

  // Check if tapping near striker to start drag
  const dx = boardPos.x - striker.body.position.x;
  const dz = boardPos.z - striker.body.position.z;
  if (Math.hypot(dx, dz) < 0.1) {
    dragStart = new THREE.Vector2(boardPos.x, boardPos.z);
    state.aiming = true;
    powerEl.classList.add('on');
  }
}

function onPointerMove(e) {
  if (!state.aiming || !pointerDown) return;
  e.preventDefault();
  const ndc = getNDC(e);
  const boardPos = screenToBoard(ndc);
  if (!boardPos) return;

  // Power based on drag distance (pull-back to shoot opposite direction)
  const dx = boardPos.x - dragStart.x;
  const dz = boardPos.z - dragStart.y;
  const dist = Math.hypot(dx, dz);
  const maxPull = 0.35;
  state.power = Math.min(dist / maxPull, 1);
  powerFill.style.width = (state.power * 100) + '%';
}

function onPointerUp(e) {
  if (!state.aiming) { pointerDown = false; return; }
  e.preventDefault();

  if (state.power > 0.05) {
    // Shoot in direction opposite to drag
    const ndc = getNDC(e);
    const boardPos = screenToBoard(ndc);
    if (boardPos) {
      const dx = dragStart.x - boardPos.x;
      const dz = dragStart.y - boardPos.z;
      const len = Math.hypot(dx, dz) || 1;
      const speed = 4.5 * state.power;
      striker.body.velocity.set((dx/len) * speed, 0, (dz/len) * speed);
      striker.body.wakeUp();
      state.phase = 'shooting';
      state.shotInProgress = true;
      state.pocketed = [];
    }
  }

  state.aiming = false;
  state.power = 0;
  powerEl.classList.remove('on');
  pointerDown = false;
}

canvas.addEventListener('pointerdown', onPointerDown);
canvas.addEventListener('pointermove', onPointerMove);
canvas.addEventListener('pointerup', onPointerUp);
canvas.addEventListener('pointercancel', onPointerUp);

// ---- Pocket detection ----
function checkPockets() {
  for (const piece of pieces) {
    if (!piece.alive) continue;
    const p = piece.body.position;
    for (const [px, pz] of pocketPositions) {
      const d = Math.hypot(p.x - px, p.z - pz);
      if (d < POCKET_R + piece.radius * 0.5) {
        pocketPiece(piece);
        break;
      }
    }
  }
}

function pocketPiece(piece) {
  piece.alive = false;
  piece.mesh.visible = false;
  piece.body.velocity.set(0, 0, 0);
  piece.body.angularVelocity.set(0, 0, 0);
  piece.body.position.set(0, -10, 0); // hide physics body far below
  piece.body.sleep();
  state.pocketed.push(piece);
}

// ---- Turn resolution ----
function resolveShot() {
  if (!state.shotInProgress) return;
  state.shotInProgress = false;

  const myColor = PLAYER_COLORS[state.turn];
  let pocketedOwn = 0;
  let pocketedOpponent = 0;
  let pocketedQueen = false;
  let strikerFoul = false;

  for (const piece of state.pocketed) {
    if (piece.type === 'striker') {
      strikerFoul = true;
    } else if (piece.color === 'queen') {
      pocketedQueen = true;
      state.queenPocketed = true;
      state.queenPocketedBy = state.turn;
    } else if (piece.color === myColor) {
      pocketedOwn++;
      state.scores[state.turn]++;
    } else {
      pocketedOpponent++;
      state.scores[1 - state.turn]++;
    }
  }

  let extraTurn = false;
  let msg = '';

  // Striker foul: penalty — put one of your pocketed pucks back
  if (strikerFoul) {
    msg = 'Foul! Striker pocketed.';
    // If you had pocketed pucks, one goes back to center
    if (state.scores[state.turn] > 0) {
      state.scores[state.turn]--;
    }
  }

  // Queen handling
  if (pocketedQueen) {
    msg = 'Queen pocketed! Cover it with your puck next.';
    state.queenPocketed = true;
    state.queenCovered = false;
    extraTurn = true; // get another shot to cover
  }

  if (state.queenPocketed && !state.queenCovered && !pocketedQueen) {
    // If queen was pocketed on a previous turn and this shot pockets own puck → covered
    if (pocketedOwn > 0 && state.queenPocketedBy === state.turn) {
      state.queenCovered = true;
      state.scores[state.turn] += 3;
      msg = 'Queen covered! +3 points';
    } else if (pocketedOwn === 0 && state.queenPocketedBy === state.turn) {
      // Failed to cover — queen returns to center
      state.queenPocketed = false;
      state.queenCovered = false;
      state.queenPocketedBy = null;
      respawnQueen();
      msg = 'Queen not covered — returned to center.';
    }
  }

  // Extra turn if you pocketed at least one of your own
  if (pocketedOwn > 0 && !strikerFoul) extraTurn = true;

  if (msg) showMsg(msg, 1800);

  // Check win: all pucks of your color pocketed (and queen resolved)
  const remaining = pieces.filter(p => p.alive && p.color === myColor && p.type === 'puck').length;
  if (remaining === 0 && (!state.queenPocketed || state.queenCovered)) {
    showMsg(PLAYER_NAMES[state.turn] + ' WINS!', 4000);
    state.phase = 'over';
    return;
  }

  state.pocketed = [];

  if (extraTurn) {
    // Same player shoots again
    state.phase = 'aim';
    positionStriker();
    updateHUD();
  } else {
    // Switch turn
    state.turn = 1 - state.turn;
    updateHUD();
    // If queen was pocketed but not covered by the same player, and they switched...
    if (state.queenPocketed && !state.queenCovered && state.queenPocketedBy !== state.turn) {
      // Queen goes back
      state.queenPocketed = false;
      state.queenCovered = false;
      state.queenPocketedBy = null;
      respawnQueen();
      showMsg('Queen returned — opponent failed to cover.', 1800);
    }
    // Respawn striker for new player
    striker.alive = false;
    striker.body.position.set(0, -10, 0);
    striker.mesh.visible = false;
    showPass();
  }
}

function respawnQueen() {
  // Find existing queen piece
  let queen = pieces.find(p => p.color === 'queen');
  if (queen) {
    // Check if center is clear; if not, place slightly offset
    let spot = { x:0, z:0 };
    let tries = 0;
    while (tries < 20) {
      let clear = true;
      for (const p of pieces) {
        if (p === queen || !p.alive) continue;
        const d = Math.hypot(p.body.position.x - spot.x, p.body.position.z - spot.z);
        if (d < PUCK_R * 2.2) { clear = false; break; }
      }
      if (clear) break;
      const a = tries * 0.7;
      spot.x = Math.cos(a) * PUCK_R * 2.5;
      spot.z = Math.sin(a) * PUCK_R * 2.5;
      tries++;
    }
    queen.alive = true;
    queen.mesh.visible = true;
    queen.body.position.set(spot.x, PUCK_H/2, spot.z);
    queen.body.velocity.set(0, 0, 0);
    queen.body.angularVelocity.set(0, 0, 0);
    queen.body.wakeUp();
  } else {
    addPiece(0, 0, 'puck', 'queen');
  }
}

// ---- Check if everything is at rest ----
function allAtRest() {
  for (const piece of pieces) {
    if (!piece.alive) continue;
    const v = piece.body.velocity;
    const w = piece.body.angularVelocity;
    if (v.length() > 0.05 || w.length() > 0.1) return false;
  }
  return true;
}

// ---- Animation loop ----
let lastTime = performance.now();
let restTimer = 0;

function animate() {
  requestAnimationFrame(animate);

  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  // Step physics
  world.step(1/120, dt, 6);

  // Sync meshes
  for (const piece of pieces) {
    if (!piece.alive) continue;
    piece.mesh.position.copy(piece.body.position);
    piece.mesh.quaternion.copy(piece.body.quaternion);
  }

  // Check pockets
  checkPockets();

  // Reset positions if a piece somehow escaped
  for (const piece of pieces) {
    if (!piece.alive) continue;
    const p = piece.body.position;
    if (Math.abs(p.x) > BOARD + 0.2 || Math.abs(p.z) > BOARD + 0.2 || p.y < -0.5) {
      // Fell out of board — pocket it
      pocketPiece(piece);
    }
  }

  // Shot resolution: when shooting and all rest
  if (state.phase === 'shooting' && state.shotInProgress) {
    if (allAtRest()) {
      restTimer += dt;
      if (restTimer > 0.25) {
        restTimer = 0;
        resolveShot();
      }
    } else {
      restTimer = 0;
    }
  }

  // Gentle camera follow of striker during aim
  if (state.phase === 'aim' && striker.alive) {
    const targetZ = striker.body.position.z;
    const desiredCamZ = state.turn === 0 ? targetZ + 0.75 : targetZ - 0.75;
    camera.position.z += (desiredCamZ - camera.position.z) * 0.08;
    camera.position.y += (0.95 - camera.position.y) * 0.08;
    camera.lookAt(0, 0, 0);
  }

  renderer.render(scene, camera);
}

// ---- Init ----
function init() {
  updateHUD();
  positionStriker();
  // Start with pass screen so player 1 knows it's their turn
  showPass();
}

init();
animate();

// ---- Resize ----
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---- Prevent scroll/zoom on mobile ----
document.addEventListener('gesturestart', e => e.preventDefault());
</script>
</body>
</html>
